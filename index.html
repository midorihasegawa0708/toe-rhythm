<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf7ff" id="themeColor">
<title>Foot Training｜足指リズムトレーニング</title>
<style>
:root{
  --ink:#14346f;--muted:#577096;--panel:rgba(255,255,255,.82);
  --line:rgba(31,91,163,.16);--blue:#178ce9;--pink:#f56f9b;--yellow:#ffbd3d;
  --safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
body{color:var(--ink);background:#dff4ff;overflow-x:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
.app{width:min(100%,620px);min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:#dff4ff}
.app::before,.app::after{content:"";position:absolute;pointer-events:none;z-index:0}
.app::before{inset:0;background:
 radial-gradient(circle at 14% 8%,rgba(255,255,255,.95) 0 3%,transparent 9%),
 radial-gradient(circle at 84% 11%,rgba(255,255,255,.8) 0 4%,transparent 13%)}
.app::after{left:0;right:0;bottom:0;height:42%;background:
 linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.38) 16%,transparent 17%),
 repeating-radial-gradient(ellipse at 50% 0,#31b9ee 0 7px,#73d8f4 8px 13px,#fff 14px 16px,transparent 17px 31px),
 linear-gradient(#39b8eb,#28a8df 45%,#ffe2b4 46%,#f6ce91)}
body.night{background:#081540;color:#fff}
body.night .app{background:
 radial-gradient(circle at 75% 12%,#fff8bf 0 2.5%,transparent 2.8%),
 radial-gradient(circle at 75.7% 11.5%,#0d1f59 0 2.6%,transparent 2.9%),
 linear-gradient(#07143d 0%,#102c70 64%,#071d51 65%,#06163e 100%)}
body.night .app::before{background:
 radial-gradient(circle at 18% 12%,#fff 0 1px,transparent 2px),
 radial-gradient(circle at 36% 7%,#fff 0 1px,transparent 2px),
 radial-gradient(circle at 58% 14%,#fff 0 1px,transparent 2px),
 radial-gradient(circle at 88% 23%,#fff 0 1px,transparent 2px),
 radial-gradient(circle at 24% 30%,#b9c8ff 0 1px,transparent 2px),
 radial-gradient(circle at 69% 31%,#fff 0 1px,transparent 2px),
 radial-gradient(ellipse at 54% 10%,rgba(137,117,255,.35),transparent 38%)}
body.night .app::after{height:38%;background:
 linear-gradient(to bottom,transparent 0 5%,rgba(255,255,255,.07) 6%,transparent 8%),
 repeating-radial-gradient(ellipse at 62% 0,rgba(103,139,255,.34) 0 5px,rgba(35,71,164,.35) 6px 13px,transparent 14px 28px),
 linear-gradient(transparent,#071337)}
body.night{--ink:#fff;--muted:#c7d3ff;--panel:rgba(8,24,74,.73);--line:rgba(255,255,255,.20);--blue:#58a7ff;--pink:#ff7eac}
.content{position:relative;z-index:1;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + var(--safe))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.theme-switch{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.60);box-shadow:0 7px 22px rgba(25,71,130,.12)}
body.night .theme-switch{background:rgba(8,22,69,.72)}
.theme-switch button{border:0;background:transparent;color:var(--muted);font-weight:900;border-radius:999px;padding:8px 13px}
.theme-switch button.active{color:#0d62c6;background:#fff;box-shadow:0 4px 12px rgba(16,70,130,.15)}
body.night .theme-switch button.active{color:#fff;background:rgba(93,111,210,.45)}
.help-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);color:var(--ink);background:var(--panel);font-weight:900}
.hero{text-align:center;margin:20px 0 16px;text-shadow:0 2px 12px rgba(255,255,255,.7)}
body.night .hero{text-shadow:0 2px 15px rgba(55,76,210,.7)}
.hero h1{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(36px,10vw,54px);letter-spacing:.10em}
.hero p{margin:6px 0 0;font-size:15px;font-weight:800;letter-spacing:.16em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 45px rgba(30,75,130,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.setup{padding:16px}
.section-title{text-align:center;margin:0 0 12px;font-size:14px;letter-spacing:.08em}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{min-height:98px;border:2px solid transparent;border-radius:18px;background:rgba(255,255,255,.68);color:#185db1;font-weight:950;font-size:17px}
.mode-btn .feet{display:block;font-size:33px;margin-top:8px}
.mode-btn.selected{border-color:#ff8bab;background:rgba(255,246,250,.94);color:#e94f82;box-shadow:0 8px 20px rgba(245,111,155,.18)}
body.night .mode-btn{background:rgba(26,49,110,.62);color:#8fc2ff}
body.night .mode-btn.selected{background:rgba(255,246,250,.92);color:#d84d86}
.settings{margin-top:12px;display:grid;grid-template-columns:1.35fr .8fr;gap:10px}
.field label{display:block;font-size:11px;font-weight:900;color:var(--muted);margin:0 0 5px 3px}
select{width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.74);color:#173d76;padding:0 10px;outline:none}
body.night select{background:rgba(17,39,100,.86);color:#fff}
.bpm-control{display:grid;grid-template-columns:39px 1fr 39px;gap:5px}
.bpm-control button,.bpm-value{height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.74);color:var(--ink);display:grid;place-items:center;font-weight:950}
body.night .bpm-control button,body.night .bpm-value{background:rgba(17,39,100,.86)}
.start{width:100%;height:58px;margin-top:13px;border:0;border-radius:999px;color:#fff;background:linear-gradient(135deg,#168fe8,#1267cf);font-size:21px;font-weight:950;letter-spacing:.08em;box-shadow:0 10px 24px rgba(15,111,211,.28)}
body.night .start{background:linear-gradient(135deg,#624ee6,#2838aa)}
.start.running{background:linear-gradient(135deg,#ff6d91,#ef3e68)}
.stage{margin-top:12px;min-height:310px;padding:14px;position:relative;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.timer{font-size:27px;font-weight:950;font-variant-numeric:tabular-nums}
.status{font-size:12px;color:var(--muted);font-weight:850}
.beats{display:flex;gap:8px}
.beats i{width:8px;height:8px;border-radius:50%;background:rgba(23,89,167,.20)}
body.night .beats i{background:rgba(255,255,255,.20)}
.beats i.on{background:var(--yellow);transform:scale(1.45)}
.lanes{display:grid;gap:10px}
.lane{height:94px;position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.44)}
body.night .lane{background:rgba(8,26,80,.55)}
.lane.hidden{display:none}
.target{position:absolute;left:14px;top:50%;width:64px;height:64px;transform:translateY(-50%);border:4px solid #ffd15a;border-radius:50%;box-shadow:0 0 0 6px rgba(255,209,90,.15)}
.note{position:absolute;top:50%;left:0;width:59px;height:59px;margin-top:-29.5px;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;font-size:14px;font-weight:950;box-shadow:0 7px 18px rgba(0,0,0,.18);will-change:transform}
.note.goo{background:#45a4ff}.note.choki{background:#ffd35c;color:#644300}.note.paa{background:#ff7fa8}
.cues{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cue{min-height:62px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.58);display:grid;place-items:center;text-align:center}
body.night .cue{background:rgba(13,33,91,.66)}
.cue.hidden{display:none}
.cue small{display:block;color:var(--muted);font-weight:800}
.cue strong{font-size:25px}.cue .goo{color:#178ce9}.cue .choki{color:#e79d00}.cue .paa{color:#ed5f8d}
.help{display:none;position:fixed;inset:0;z-index:50;padding:20px;background:rgba(1,9,31,.66);backdrop-filter:blur(12px)}
.help.open{display:grid;place-items:center}
.help-box{width:min(100%,440px);padding:20px;background:#fff;color:#173d76;border-radius:22px}
.help-box h2{margin-top:0}.help-box p{line-height:1.8;font-size:14px}
.help-box button{width:100%;height:46px;border:0;border-radius:13px;background:#197fe0;color:#fff;font-weight:900}
.help-box{position:relative;padding:24px 22px 22px}
.help-close-icon{
  position:absolute;top:12px;right:12px;width:34px;height:34px;border:0;border-radius:50%;
  background:rgba(20,52,111,.08);color:#173d76;font-size:24px;font-weight:500;line-height:1;
  display:grid;place-items:center;padding:0;box-shadow:none
}
.help-close-icon:hover{background:rgba(20,52,111,.14)}
.help-close-icon:active{transform:scale(.92)}
.toe-guide{display:grid;gap:10px;margin:14px 0 16px}
.toe-guide-item{
  display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;
  padding:10px 12px;border-radius:14px;background:#f4f8ff;font-size:14px;line-height:1.55
}
.toe-guide-item strong{font-size:18px;text-align:center}
.goo-text{color:#178ce9}.choki-text{color:#d69200}.paa-text{color:#ed5f8d}

@media(min-width:700px){body{padding:18px}.app{border-radius:30px;min-height:calc(100dvh - 36px);box-shadow:0 22px 70px rgba(17,55,105,.18)}}
</style>

<style id="premium-ui">
:root{
  --ink:#0b1b35;
  --muted:#66758d;

}

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;

    radial-gradient(ellipse at 54% 18%,rgba(99,84,204,.34) 0%,rgba(66,80,168,.15) 24%,transparent 52%),

}
.hero{margin:29px 0 21px}
.hero h1{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:clamp(43px,11vw,66px);
  font-weight:700;
  line-height:.95;
  letter-spacing:.025em;
  color:#102b5f;
  text-shadow:0 9px 28px rgba(255,255,255,.62);
}
body.night .hero h1{
  color:#fff;
  text-shadow:0 0 30px rgba(146,164,255,.46);
}

  margin-top:11px;
  font-size:11px;

  box-shadow:0 10px 24px rgba(16,45,85,.08);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .34s ease,background .34s ease,border-color .34s ease;
}
.mode-btn:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(16,45,85,.15)}
.mode-btn:active{transform:scale(.975)}
.mode-btn .feet{transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.mode-btn:hover .feet{transform:translateY(-2px) scale(1.05)}
.theme-switch button,.help-btn,.bpm-control button,.help-box button{
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,background .25s ease,color .25s ease;
}
.theme-switch button:hover,.bpm-control button:hover,.help-btn:hover{transform:translateY(-2px)}
.theme-switch button:active,.bpm-control button:active,.help-btn:active,.help-box button:active{transform:scale(.94)}
select{
  box-shadow:0 8px 20px rgba(16,45,85,.06);
  transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease;
}
select:focus{
  border-color:rgba(31,122,245,.45);
  box-shadow:0 0 0 4px rgba(31,122,245,.10);
}

  height:62px;
  position:relative;

}
.start::before{
  content:"";

}
.start:hover{
  transform:translateY(-3px);

  filter:saturate(1.05);
}
.start:hover::before{transform:translateX(125%)}
.start:active{transform:scale(.985)}
body.night .start{
  background:linear-gradient(135deg,#7768f1,#3947ba);
  box-shadow:0 16px 38px rgba(78,77,214,.35);
}
.lane{border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}

</style>


<style id="training-flow">
.duration-field{margin-top:14px}
.duration-field>label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin:0 0 7px 4px;letter-spacing:.05em}
.duration-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.duration-options button{height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--ink);font-weight:800;box-shadow:0 8px 20px rgba(16,45,85,.06);transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s ease,background .26s ease,color .26s ease,border-color .26s ease}
.duration-options button:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(16,45,85,.12)}
.duration-options button:active{transform:scale(.95)}
.duration-options button.selected{color:#fff;border-color:transparent;background:linear-gradient(135deg,#2188f5,#155fd2);box-shadow:0 12px 26px rgba(21,95,210,.25)}
body.night .duration-options button{background:rgba(14,34,87,.80)}
body.night .duration-options button.selected{background:linear-gradient(135deg,#7768f1,#3947ba)}
.content.training .top,.content.training .hero,.content.training .setup{display:none}
.content.training{min-height:100dvh;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + var(--safe));display:flex;align-items:stretch}
.content.training .stage{margin:0;width:100%;min-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - var(--safe));display:flex;flex-direction:column;justify-content:center;border-radius:30px}
.content.training .stage-head{margin-bottom:18px}
.content.training .lanes{flex:1;align-content:center}
.content.training .lane{height:clamp(130px,22vh,190px)}
.content.training .target{width:78px;height:78px}
.content.training .note{width:70px;height:70px;margin-top:-35px;font-size:16px}
.game-stop{display:none;width:100%;height:54px;margin-top:16px;border:0;border-radius:999px;background:rgba(255,255,255,.78);color:#d94d76;font-weight:800;box-shadow:0 12px 26px rgba(16,45,85,.12);backdrop-filter:blur(16px)}
body.night .game-stop{background:rgba(17,38,94,.82);color:#ff94b5}
.content.training .game-stop{display:block}
@media(max-width:420px){.duration-options{gap:6px}.duration-options button{font-size:13px;padding:0 4px}.content.training .lane{height:120px}}
</style>

<body>
<main class="app">
<div class="content">
  <div class="top">
    <div class="theme-switch" aria-label="背景を選択">
      <button id="dayBtn" class="active">☀ 昼</button>
      <button id="nightBtn">☾ 夜</button>
    </div>
    <button class="help-btn" id="helpBtn" aria-label="使い方">?</button>
  </div>

  <header class="hero">
    <h1>Foot Training</h1>
    <p>Toe Rhythm Training</p>
  </header>

  <section class="card setup">
    <h2 class="section-title">モードを選択</h2>
    <div class="mode-grid">
      <button class="mode-btn selected" data-mode="single">片足モード<span class="feet">🦶</span></button>
      <button class="mode-btn" data-mode="both">両足モード<span class="feet">🦶🦶</span></button>
    </div>

    <div class="settings">
      <div class="field">
        <label for="music">音楽</label>
        <select id="music">
          <option value="festival">お祭りビート</option>
          <option value="retro">レトロポップ</option>
          <option value="rock">王道ロック</option>
          <option value="game" selected>ゲーム風ポップ</option>
          <option value="dance">ダンスビート</option>
          <option value="lofi">ローファイ</option>
          <option value="tropical">トロピカル</option>
          <option value="click">メトロノーム</option>
          <option value="off">音なし</option>
        </select>
      </div>
      <div class="field">
        <label>テンポ（BPM）</label>
        <div class="bpm-control">
          <button id="minusBtn">−</button><div class="bpm-value" id="bpmValue">100</div><button id="plusBtn">＋</button>
        </div>
      </div>
    </div>

    <div class="duration-field">
      <label>トレーニング時間</label>
      <div class="duration-options" role="group" aria-label="トレーニング時間">
        <button type="button" data-seconds="20">20秒</button>
        <button type="button" data-seconds="30">30秒</button>
        <button type="button" data-seconds="45">45秒</button>
        <button type="button" data-seconds="60" class="selected">60秒</button>
      </div>
    </div>
    <button class="start" id="startBtn">スタート</button>
  </section>

  <section class="card stage">
    <div class="stage-head">
      <div><div class="timer" id="timer">01:00</div><div class="status" id="status">準備ができたらスタート</div></div>
      <div class="beats"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="lanes">
      <div class="lane" id="lane1"><div class="target"></div></div>
      <div class="lane hidden" id="lane2"><div class="target"></div></div>
    </div>
    <button class="game-stop" id="gameStopBtn">トレーニングを終了</button>
  </section>
</div>
</main>

<div class="help" id="help">
  <div class="help-box">
    <button class="help-close-icon" id="closeHelp" aria-label="説明を閉じる">×</button>
    <h2>使い方</h2>
    <p>片足モードでは1つの指示、両足モードでは2つの指示が同時に流れます。黄色い円に合ったタイミングで、足指を「グー・チョキ・パー」に動かしてください。</p>

    <div class="toe-guide">
      <div class="toe-guide-item">
        <strong class="goo-text">グー</strong>
        <span>5本の足指をぎゅっと丸めます。</span>
      </div>
      <div class="toe-guide-item">
        <strong class="choki-text">チョキ</strong>
        <span>親指だけを上げ、ほかの4本の指を床につけます。</span>
      </div>
      <div class="toe-guide-item">
        <strong class="paa-text">パー</strong>
        <span>5本の足指をできるだけ大きく広げます。</span>
      </div>
    </div>

    <p>昼は海と空、夜は星空の背景に切り替えられます。</p>
  </div>
</div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const lane1=$("#lane1"),lane2=$("#lane2");
const startBtn=$("#startBtn"),status=$("#status"),timer=$("#timer"),music=$("#music");
const bpmValue=$("#bpmValue"),beatDots=$$(".beats i");
let mode="single",bpm=100,duration=60,running=false,token=0,audio=null,master=null,delay=null,delayGain=null;
let scheduler=null,countdown=null,nextBeat=0,beatIndex=0,seconds=60;
const TYPES={
 goo:{label:"グー",cls:"goo",freq:523.25},
 choki:{label:"チョキ",cls:"choki",freq:659.25},
 paa:{label:"パー",cls:"paa",freq:783.99}
};
const randomType=()=>Object.keys(TYPES)[Math.floor(Math.random()*3)];

function setTheme(name){
 document.body.classList.toggle("night",name==="night");
 $("#dayBtn").classList.toggle("active",name==="day");
 $("#nightBtn").classList.toggle("active",name==="night");
 $("#themeColor").content=name==="night"?"#081540":"#eaf7ff";
 localStorage.setItem("toeTheme",name);
}
$("#dayBtn").onclick=()=>setTheme("day");
$("#nightBtn").onclick=()=>setTheme("night");
setTheme(localStorage.getItem("toeTheme")||"day");

$$(".mode-btn").forEach(btn=>btn.onclick=()=>{
 mode=btn.dataset.mode;
 $$(".mode-btn").forEach(x=>x.classList.toggle("selected",x===btn));
 lane2.classList.toggle("hidden",mode!=="both");
});


$$(".duration-options button").forEach(btn=>btn.onclick=()=>{
 duration=Number(btn.dataset.seconds);
 $$(".duration-options button").forEach(x=>x.classList.toggle("selected",x===btn));
 const m=String(Math.floor(duration/60)).padStart(2,"0");
 const s=String(duration%60).padStart(2,"0");
 timer.textContent=`${m}:${s}`;
});

$("#minusBtn").onclick=()=>{bpm=Math.max(60,bpm-5);bpmValue.textContent=bpm};
$("#plusBtn").onclick=()=>{bpm=Math.min(180,bpm+5);bpmValue.textContent=bpm};
$("#helpBtn").onclick=()=>$("#help").classList.add("open");
function closeHelp(){
 $("#help").classList.remove("open");
}
$("#closeHelp").onclick=closeHelp;
$("#help").onclick=(e)=>{ if(e.target.id==="help") closeHelp(); };

async function ensureAudio(){
 const C=window.AudioContext||window.webkitAudioContext;
 if(!C)throw Error("音声非対応");
 if(!audio||audio.state==="closed"){
   audio=new C();
   const comp=audio.createDynamicsCompressor();
   master=audio.createGain();master.gain.value=.28;
   delay=audio.createDelay(.5);delay.delayTime.value=.22;
   delayGain=audio.createGain();delayGain.gain.value=.10;
   master.connect(comp);delay.connect(delayGain);delayGain.connect(comp);comp.connect(audio.destination);
 }
 if(audio.state==="suspended")await audio.resume();
}
function osc(t,f,d,v,type="sine",echo=0){
 if(!audio||music.value==="off")return;
 const o=audio.createOscillator(),g=audio.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(master);
 if(echo){const s=audio.createGain();s.gain.value=echo;g.connect(s);s.connect(delay)}
 o.start(t);o.stop(t+d+.04);
}
function noise(t,d,v,filter=5000){
 if(!audio||music.value==="off")return;
 const n=audio.createBufferSource(),buf=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
 n.buffer=buf;
 const f=audio.createBiquadFilter(),g=audio.createGain();f.type="lowpass";f.frequency.value=filter;g.gain.value=v;
 n.connect(f);f.connect(g);g.connect(master);n.start(t);
}
function playMusic(t,i){
 const m=music.value,p=i%8,bar=Math.floor(i/8);
 if(m==="off")return;
 if(m==="click"){osc(t,p===0?1100:760,.045,p===0?.12:.055,"square");return}
 if(m==="festival"){
  if([0,3,4,6].includes(p)){osc(t,p===0||p===4?72:96,.14,.18);osc(t,150,.05,.05,"triangle")}
  if(p===2||p===6)noise(t,.06,.05,2200);
 }else if(m==="retro"){
  const r=[130.81,110,146.83,123.47][bar%4];
  if(p===0||p===4)osc(t,58,.15,.13);if(p===2||p===6)noise(t,.08,.065,1600);
  if(p===0)[1,1.25,1.5,1.875].forEach((x,k)=>osc(t,r*x,.46,.020-k*.002,"triangle",.15));
 }else if(m==="rock"){
  const r=[82.41,98,110,73.42][bar%4];
  if([0,3,4].includes(p))osc(t,54,.15,p===0||p===4?.19:.12);
  if(p===2||p===6)noise(t,.10,.10,1200);if(p%2===0)osc(t,r,.12,.035,"sawtooth");
 }else if(m==="game"){
  const r=[261.63,293.66,329.63,246.94][bar%4],mel=[1,1.25,1.5,2,1.5,1.25,1.875,1.5][p];
  if(p===0||p===4)osc(t,57,.13,.11);if(p===2||p===6)noise(t,.055,.045,2400);
  osc(t,r*mel,.07,.022,"square",.11);
 }else if(m==="dance"){
  const r=[110,123.47,98,130.81][bar%4];
  if(p%2===0)osc(t,52,.16,.17);if(p===2||p===6)noise(t,.07,.06,2100);
  if(p%2===1)osc(t,r*(p===3||p===7?2:1),.08,.028,"square",.1);
 }else if(m==="lofi"){
  const r=[220,196,174.61,164.81][bar%4];
  if(p===0||p===4)osc(t,61,.19,.08);if(p===2||p===6)noise(t,.07,.04,1300);
  if(p===0)[1,1.1892,1.4983,1.7818].forEach((x,k)=>osc(t,r*x,.78,.016-k*.001,"sine",.25));
 }else if(m==="tropical"){
  const r=[130.81,146.83,164.81,123.47][bar%4];
  if([0,3,5,7].includes(p))osc(t,p===0?170:235,.05,.055,"triangle");
  if(p===2||p===6)noise(t,.06,.045,2300);
  if(p===0||p===4)[1,1.25,1.5].forEach((x,k)=>osc(t,r*x*2,.20,.013-k*.001,"sine",.2));
 }
}
function cueSound(type,t){osc(t,TYPES[type].freq,.085,.035,"sine",.1)}
function spawn(lane,type,when,myToken){
 const note=document.createElement("div");note.className=`note ${TYPES[type].cls}`;note.textContent=TYPES[type].label;lane.appendChild(note);
 const now=audio?audio.currentTime:0;
 const travel=Math.max(1.15,when-now);
 const from=lane.clientWidth+12;
 const to=18;
 const anim=note.animate(
   [{transform:`translateX(${from}px)`},{transform:`translateX(${to}px)`}],
   {duration:travel*1000,easing:"linear",fill:"forwards"}
 );
 setTimeout(()=>{if(myToken!==token)return;cueSound(type,audio.currentTime)},Math.max(0,(when-now)*1000));
 anim.finished.then(()=>setTimeout(()=>note.remove(),170)).catch(()=>note.remove());
}
function scheduleBeat(t,i,myToken){
 playMusic(t,i);
 const idx=i%4;
 setTimeout(()=>{if(myToken!==token)return;beatDots.forEach((d,n)=>d.classList.toggle("on",n===idx))},Math.max(0,(t-audio.currentTime)*1000));
 if(i%2===0){
   const hitTime=t+(60/bpm)*4;
   const type1=randomType();spawn(lane1,type1,hitTime,myToken);
   if(mode==="both"){const type2=randomType();spawn(lane2,type2,hitTime,myToken)}
 }
}
function schedulerLoop(myToken){
 if(!running||myToken!==token||!audio)return;
 while(nextBeat<audio.currentTime+.18){
   scheduleBeat(nextBeat,beatIndex++,myToken);
   nextBeat+=60/bpm;
 }
 scheduler=setTimeout(()=>schedulerLoop(myToken),45);
}
function updateTimer(){
 const m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");timer.textContent=`${m}:${s}`;
}
function stop(){
 running=false;token++;clearTimeout(scheduler);clearInterval(countdown);
 $(".content").classList.remove("training");
 startBtn.textContent="スタート";startBtn.classList.remove("running");status.textContent="準備ができたらスタート";
 beatDots.forEach(d=>d.classList.remove("on"));document.querySelectorAll(".note").forEach(n=>n.remove());
}
async function start(){
 try{
   await ensureAudio();
   stop();running=true;const myToken=token;seconds=duration;updateTimer();
   $(".content").classList.add("training");
   startBtn.textContent="停止";startBtn.classList.add("running");status.textContent=mode==="both"?"両足モードでトレーニング中":"片足モードでトレーニング中";
   beatIndex=0;nextBeat=audio.currentTime+.25;schedulerLoop(myToken);
   countdown=setInterval(()=>{seconds--;updateTimer();if(seconds<=0)stop()},1000);
 }catch(e){status.textContent="音声を開始できません。もう一度押してください"}
}
startBtn.onclick=()=>running?stop():start();
$("#gameStopBtn").onclick=stop;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running)stop()});
window.addEventListener("pagehide",stop);
})();
</script>
</body>
</html>
