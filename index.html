<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11101d" />
  <title>TOE RHYTHM｜足指グーチョキパートレーニング</title>
  <style>
    :root {
      --bg:#0d0c16; --panel:#1b192c; --panel2:#24213a; --text:#f7f5ff;
      --muted:#aaa6bf; --line:rgba(255,255,255,.11);
      --goo:#2f8cff; --choki:#ffd84a; --paa:#ff5f8f; --accent:#8f7cff;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow-x:hidden}
    button,select,input{font:inherit} button{color:inherit}
    .app{width:min(100%,540px);min-height:100dvh;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(330px,1fr) auto;background:radial-gradient(circle at 50% -10%,rgba(143,124,255,.18),transparent 35%),var(--bg)}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:rgba(13,12,22,.9);backdrop-filter:blur(14px);position:relative;z-index:10}
    .brand{display:flex;align-items:center;gap:10px}.brand-mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#7565ff,#a991ff);font-size:20px}
    h1{margin:0;font-size:16px;letter-spacing:.04em}.subtitle{margin-top:3px;color:var(--muted);font-size:10px}
    .icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer}
    .status-bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
    .time{font-variant-numeric:tabular-nums;font-size:26px;font-weight:900;letter-spacing:.04em}
    .status-text{color:var(--muted);font-size:12px;font-weight:800;text-align:right}
    .stage{position:relative;overflow:hidden;min-height:350px;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),#11101d;background-size:32px 32px;border-bottom:1px solid var(--line)}
    .beat-dots{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:8}
    .beat-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:.08s}.beat-dot.on{transform:scale(1.6);background:#fff}
    .lanes{position:absolute;inset:42px 0 92px;display:grid;grid-template-rows:1fr 1fr;gap:8px;padding:0 0}
    .lane-wrap{position:relative;min-height:110px}
    .lane-label{position:absolute;left:8px;top:8px;z-index:7;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid var(--line);font-size:11px;font-weight:900}
    .lane{position:absolute;left:0;right:0;top:50%;height:88px;transform:translateY(-50%);border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);overflow:hidden}
    .target{position:absolute;left:24px;top:50%;width:68px;height:68px;transform:translateY(-50%);border:4px solid #ffe279;border-radius:50%;box-shadow:0 0 0 6px rgba(255,226,121,.12),0 0 26px rgba(255,226,121,.24);z-index:3}
    .target::after{content:"";position:absolute;inset:11px;border:1px solid rgba(255,255,255,.25);border-radius:50%}
    .target.pulse{animation:targetPulse .24s ease-out}@keyframes targetPulse{50%{transform:translateY(-50%) scale(1.14);filter:brightness(1.5)}}
    .hit-line{position:absolute;left:58px;top:0;bottom:0;width:2px;background:linear-gradient(transparent,rgba(255,226,121,.7),transparent);opacity:.7;z-index:2}
    .note{position:absolute;left:0;top:50%;width:62px;height:62px;margin-top:-31px;display:grid;place-items:center;border-radius:50%;font-size:16px;font-weight:950;border:3px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:4;will-change:transform}
    .note.goo{background:var(--goo)}.note.choki{background:var(--choki);color:#2a2510}.note.paa{background:var(--paa)}
    .cue-board{position:absolute;left:14px;right:14px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:9}
    .cue-box{padding:10px 12px;border:1px solid var(--line);border-radius:15px;background:rgba(27,25,44,.9);backdrop-filter:blur(10px)}
    .cue-title{font-size:11px;color:var(--muted);font-weight:800}.cue-word{margin-top:3px;font-size:28px;line-height:1;font-weight:950}.cue-word.goo{color:var(--goo)}.cue-word.choki{color:var(--choki)}.cue-word.paa{color:var(--paa)}
    .cue-box.hidden{visibility:hidden}
    .controls{padding:12px 16px calc(14px + var(--safe-bottom));background:var(--panel)}
    .start-btn{width:100%;min-height:56px;border:0;border-radius:16px;background:linear-gradient(135deg,#6556ff,#9f78ff);box-shadow:0 12px 30px rgba(101,86,255,.28);font-size:17px;font-weight:950;cursor:pointer}
    .start-btn.running{background:linear-gradient(135deg,#ff4f76,#ff7b59)}
    .settings{margin-top:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.setting span{display:block;margin:0 0 5px 2px;color:var(--muted);font-size:10px;font-weight:800}
    select{width:100%;height:40px;padding:0 8px;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#151323;outline:none}
    .bpm-wrap{margin-top:10px;display:grid;grid-template-columns:44px 1fr 50px;gap:9px;align-items:center}.bpm-wrap span{color:var(--muted);font-size:11px;font-weight:800}input[type=range]{width:100%;accent-color:var(--accent)}.bpm-value{text-align:right;font-weight:900}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.82);font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
    .help{display:none;position:fixed;inset:0;z-index:50;padding:24px 18px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);overflow:auto}.help.open{display:grid;place-items:center}
    .help-card{width:min(100%,460px);padding:20px;border-radius:22px;background:#1c192c;border:1px solid var(--line)}.help-card h2{margin:0 0 12px}.help-card p,.help-card li{color:#d2cee0;line-height:1.7;font-size:13px}.close-help{width:100%;height:46px;border:0;border-radius:13px;background:#7262ff;font-weight:900}
    @media(min-width:700px){body{padding:20px}.app{min-height:calc(100dvh - 40px);border:1px solid var(--line);border-radius:28px;overflow:hidden}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><div class="brand-mark">🦶</div><div><h1>TOE RHYTHM</h1><div class="subtitle">音に合わせて足指グーチョキパー</div></div></div>
    <button class="icon-btn" id="helpBtn" aria-label="使い方">?</button>
  </header>

  <section class="status-bar">
    <div class="time" id="timeDisplay">01:00</div>
    <div class="status-text" id="statusText">スタートを押してください</div>
  </section>

  <section class="stage">
    <div class="beat-dots"><i class="beat-dot"></i><i class="beat-dot"></i><i class="beat-dot"></i><i class="beat-dot"></i></div>

    <div class="lanes">
      <div class="lane-wrap" id="leftWrap">
        <div class="lane-label">左足</div>
        <div class="lane" id="leftLane"><div class="hit-line"></div><div class="target" id="leftTarget"></div></div>
      </div>
      <div class="lane-wrap" id="rightWrap">
        <div class="lane-label">右足</div>
        <div class="lane" id="rightLane"><div class="hit-line"></div><div class="target" id="rightTarget"></div></div>
      </div>
    </div>

    <div class="cue-board">
      <div class="cue-box" id="leftCueBox"><div class="cue-title">左足</div><div class="cue-word goo" id="leftCueWord">グー</div></div>
      <div class="cue-box" id="rightCueBox"><div class="cue-title">右足</div><div class="cue-word paa" id="rightCueWord">パー</div></div>
    </div>
  </section>

  <section class="controls">
    <button class="start-btn" id="startBtn">▶ トレーニング開始</button>

    <div class="settings">
      <label class="setting"><span>難易度</span><select id="difficulty"><option value="easy">ゆっくり</option><option value="normal" selected>標準</option><option value="hard">ハード</option></select></label>
      <label class="setting"><span>時間</span><select id="duration"><option value="30">30秒</option><option value="60" selected>1分</option><option value="120">2分</option><option value="180">3分</option><option value="0">無制限</option></select></label>
      <label class="setting"><span>足の指定</span><select id="footMode"><option value="both" selected>両足2列</option><option value="left">左足だけ</option><option value="right">右足だけ</option><option value="random">左右ランダム</option></select></label>
    </div>

    <div class="settings">
      <label class="setting"><span>音楽</span><select id="soundMode">
        <option value="pop" selected>ポップ</option>
        <option value="rock">ロック</option>
        <option value="dance">ダンス</option>
        <option value="latin">ラテン</option>
        <option value="chill">チル</option>
        <option value="click">メトロノーム</option>
        <option value="off">音なし</option>
      </select></label>
      <label class="setting"><span>合図</span><select id="cueMode"><option value="random" selected>ランダム</option><option value="noRepeat">連続なし</option></select></label>
      <label class="setting"><span>画面</span><select id="screenMode"><option value="normal" selected>通常</option><option value="wake">消灯防止</option></select></label>
    </div>

    <div class="bpm-wrap"><span>BPM</span><input id="bpm" type="range" min="60" max="160" value="100"><div class="bpm-value" id="bpmValue">100</div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<div class="help" id="help"><div class="help-card">
  <h2>使い方</h2>
  <p>左足と右足の2列に、それぞれ別の指示が流れます。黄色い円に重なった瞬間に、表示された足でグー・チョキ・パーを作ってください。</p>
  <ul><li>グー：足指を丸める</li><li>チョキ：親指とほかの指を別々に動かす</li><li>パー：足指を広げる</li></ul>
  <p>音が出ない場合は、一度「停止」してからもう一度「トレーニング開始」を押してください。</p>
  <button class="close-help" id="closeHelp">閉じる</button>
</div></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const el = {
    start:$("startBtn"), difficulty:$("difficulty"), duration:$("duration"), footMode:$("footMode"),
    soundMode:$("soundMode"), cueMode:$("cueMode"), screenMode:$("screenMode"), bpm:$("bpm"), bpmValue:$("bpmValue"),
    time:$("timeDisplay"), status:$("statusText"), leftLane:$("leftLane"), rightLane:$("rightLane"),
    leftTarget:$("leftTarget"), rightTarget:$("rightTarget"), leftWrap:$("leftWrap"), rightWrap:$("rightWrap"),
    leftCueBox:$("leftCueBox"), rightCueBox:$("rightCueBox"), leftCueWord:$("leftCueWord"), rightCueWord:$("rightCueWord"),
    toast:$("toast"), help:$("help"), helpBtn:$("helpBtn"), closeHelp:$("closeHelp")
  };

  const TYPES = {
    goo:{label:"グー", cls:"goo", tone:440},
    choki:{label:"チョキ", cls:"choki", tone:554.37},
    paa:{label:"パー", cls:"paa", tone:659.25}
  };
  const DIFF = {
    easy:{travel:2800,gaps:[4,5,6]},
    normal:{travel:2100,gaps:[3,4,5]},
    hard:{travel:1500,gaps:[2,3,4]}
  };

  let audio=null, master=null, runToken=0, running=false, schedulerTimer=null, clockTimer=null;
  let nextTick=0, tickIndex=0, nextCue={left:0,right:0}, endPerf=Infinity, wakeLock=null;
  let pending=[], lastType={left:null,right:null}, toastTimer=null;

  const rand = arr => arr[Math.floor(Math.random()*arr.length)];
  const fmt = sec => !Number.isFinite(sec) ? "∞" : `${String(Math.floor(Math.max(0,Math.ceil(sec))/60)).padStart(2,"0")}:${String(Math.max(0,Math.ceil(sec))%60).padStart(2,"0")}`;

  function toast(text){el.toast.textContent=text;el.toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.toast.classList.remove("show"),900)}
  function save(id){localStorage.setItem("toeRhythm_"+id,el[id].value)}
  function restore(id){const v=localStorage.getItem("toeRhythm_"+id);if(v&&[...el[id].options].some(o=>o.value===v))el[id].value=v}

  async function ensureAudio(){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) throw new Error("このブラウザは音声に対応していません");
    if(!audio || audio.state==="closed"){
      audio=new Ctx();
      master=audio.createGain();
      master.gain.value=.38;
      master.connect(audio.destination);
    }
    if(audio.state==="suspended") await audio.resume();
    if(audio.state!=="running") throw new Error("音声を開始できませんでした");
  }

  function osc(t,f,d,v,type="sine"){
    if(!audio||!master||t<audio.currentTime-.05)return;
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
  }
  function noise(t,d,v,hp=3000){
    if(!audio||!master||t<audio.currentTime-.05)return;
    const n=Math.max(1,Math.floor(audio.sampleRate*d)),b=audio.createBuffer(1,n,audio.sampleRate),data=b.getChannelData(0);
    for(let i=0;i<n;i++)data[i]=Math.random()*2-1;
    const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();
    f.type="highpass";f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);
  }

  function playBeat(t,i){
    const m=el.soundMode.value, p=i%8;
    if(m==="off")return;
    if(m==="click"){osc(t,p===0?1100:760,.045,p===0?.14:.07,"square");return}
    if(m==="pop"){
      noise(t,.03,p%2===0?.04:.02,6500);
      if(p===0||p===4){osc(t,62,.13,.18);osc(t,135,.08,.1)}
      if(p===2||p===6)noise(t,.10,.12,1500);
      if(p===0)osc(t,[130.81,146.83,164.81,146.83][Math.floor(i/8)%4],.3,.06,"triangle");
    }else if(m==="rock"){
      noise(t,.04,.05,5000);
      if(p===0||p===3||p===4){osc(t,58,.18,.22);osc(t,110,.10,.1,"square")}
      if(p===2||p===6)noise(t,.13,.15,900);
      if(p%2===0)osc(t,[82.41,98,110,73.42][Math.floor(i/8)%4],.18,.045,"sawtooth");
    }else if(m==="dance"){
      noise(t,.025,.04,7000);
      if(p%2===0){osc(t,55,.16,.22);osc(t,120,.07,.09)}
      if(p===2||p===6)noise(t,.07,.08,1800);
      if(p===0||p===4)osc(t,[130.81,155.56,174.61,146.83][Math.floor(i/8)%4],.25,.055,"square");
    }else if(m==="latin"){
      if([0,3,5,7].includes(p))osc(t,p===0?180:240,.055,.10,"triangle");
      if(p===2||p===6)noise(t,.08,.09,2200);
      noise(t,.02,.025,7500);
      if(p===0)osc(t,[110,123.47,130.81,98][Math.floor(i/8)%4],.26,.05,"sine");
    }else if(m==="chill"){
      if(p===0||p===4)osc(t,64,.2,.12);
      if(p%2===0)noise(t,.025,.018,6500);
      if(p===0) {
        const root=[220,246.94,261.63,196][Math.floor(i/8)%4];
        [1,1.25,1.5].forEach((r,k)=>osc(t,root*r,.65,.028-k*.004,"sine"));
      }
    }
  }

  function cueTone(type){if(!audio||el.soundMode.value==="off")return;const t=audio.currentTime;osc(t,TYPES[type].tone,.10,.07);osc(t,TYPES[type].tone*2,.06,.02,"triangle")}

  function chooseType(side){
    const keys=Object.keys(TYPES);let x=rand(keys);
    if((el.cueMode.value==="noRepeat"||Math.random()>.25)&&x===lastType[side])x=rand(keys.filter(k=>k!==lastType[side]));
    lastType[side]=x;return x;
  }
  function setCue(side,type){
    const w=side==="left"?el.leftCueWord:el.rightCueWord;
    w.textContent=TYPES[type].label;w.className="cue-word "+TYPES[type].cls;
  }

  function createCue(side,arrival,token){
    if(!running||token!==runToken)return;
    const type=chooseType(side),lane=side==="left"?el.leftLane:el.rightLane,target=side==="left"?el.leftTarget:el.rightTarget;
    const note=document.createElement("div");note.className="note "+TYPES[type].cls;note.textContent=TYPES[type].label;lane.appendChild(note);
    const delay=Math.max(0,(arrival-audio.currentTime)*1000),startX=lane.clientWidth+12,targetX=28;
    const anim=note.animate([{transform:`translateX(${startX}px)`,opacity:.35},{transform:`translateX(${targetX}px)`,opacity:1}],{duration:Math.max(300,delay),easing:"linear",fill:"forwards"});
    pending.push({note,anim});
    const cueTimeout=setTimeout(()=>{
      if(!running||token!==runToken)return;
      setCue(side,type);target.classList.remove("pulse");void target.offsetWidth;target.classList.add("pulse");cueTone(type);
    },delay);
    const removeTimeout=setTimeout(()=>{
      note.remove();pending=pending.filter(x=>x.note!==note);
    },delay+650);
    pending[pending.length-1].timeouts=[cueTimeout,removeTimeout];
  }

  function sidesForMode(){
    const m=el.footMode.value;
    if(m==="both")return["left","right"];
    if(m==="left")return["left"];
    if(m==="right")return["right"];
    return Math.random()<.5?["left"]:["right"];
  }

  function updateLaneVisibility(){
    const m=el.footMode.value;
    const showL=m!=="right",showR=m!=="left";
    el.leftWrap.style.display=showL?"block":"none";el.rightWrap.style.display=showR?"block":"none";
    el.leftCueBox.classList.toggle("hidden",!showL);el.rightCueBox.classList.toggle("hidden",!showR);
    document.querySelector(".lanes").style.gridTemplateRows=(showL&&showR)?"1fr 1fr":"1fr";
  }

  function beatDots(i,t,token){
    const delay=Math.max(0,(t-audio.currentTime)*1000);
    setTimeout(()=>{if(!running||token!==runToken)return;const dots=document.querySelectorAll(".beat-dot");dots.forEach((d,k)=>d.classList.toggle("on",k===Math.floor((i%8)/2)));setTimeout(()=>dots.forEach(d=>d.classList.remove("on")),90)},delay);
  }

  function scheduler(token){
    if(!running||token!==runToken||!audio)return;
    const tickDur=60/Number(el.bpm.value)/2,look=.18,cfg=DIFF[el.difficulty.value],cueLook=cfg.travel/1000+.18;
    while(nextTick<audio.currentTime+look){playBeat(nextTick,tickIndex);beatDots(tickIndex,nextTick,token);nextTick+=tickDur;tickIndex++}
    for(const side of ["left","right"]){
      const active=sidesForMode().includes(side);
      if(!active&&el.footMode.value!=="both")continue;
      while(nextCue[side]<audio.currentTime+cueLook){
        if(el.footMode.value==="random"){
          const chosen=sidesForMode()[0];
          if(chosen===side)createCue(side,nextCue[side],token);
        }else createCue(side,nextCue[side],token);
        nextCue[side]+=tickDur*rand(cfg.gaps)+(side==="right"&&el.footMode.value==="both"?tickDur*Math.random():0);
      }
    }
    schedulerTimer=setTimeout(()=>scheduler(token),30);
  }

  function clearAll(){
    clearTimeout(schedulerTimer);clearInterval(clockTimer);
    pending.forEach(x=>{try{x.anim.cancel()}catch(_){ }(x.timeouts||[]).forEach(clearTimeout);x.note.remove()});pending=[];
    document.querySelectorAll(".beat-dot").forEach(d=>d.classList.remove("on"));
  }
  async function requestWake(){if(el.screenMode.value==="wake"&&"wakeLock"in navigator){try{wakeLock=await navigator.wakeLock.request("screen")}catch(_){}}}
  async function releaseWake(){try{if(wakeLock)await wakeLock.release()}catch(_){}wakeLock=null}

  async function start(){
    if(running)return;
    clearAll();runToken++;const token=runToken;
    try{await ensureAudio()}catch(err){toast(err.message||"音声を開始できません");return}
    running=true;lastType={left:null,right:null};updateLaneVisibility();
    const dur=Number(el.duration.value);endPerf=dur>0?performance.now()+dur*1000:Infinity;
    el.time.textContent=fmt(dur>0?dur:Infinity);el.status.textContent="トレーニング中";el.start.textContent="■ ストップ";el.start.classList.add("running");
    [el.difficulty,el.duration,el.footMode,el.cueMode].forEach(x=>x.disabled=true);
    await requestWake();
    const tickDur=60/Number(el.bpm.value)/2,travel=DIFF[el.difficulty.value].travel/1000;
    nextTick=audio.currentTime+.12;tickIndex=0;nextCue.left=audio.currentTime+travel+tickDur*2;nextCue.right=audio.currentTime+travel+tickDur*2.5;
    scheduler(token);
    clockTimer=setInterval(()=>{if(!running||token!==runToken)return;const left=(endPerf-performance.now())/1000;el.time.textContent=fmt(left);if(left<=0)stop(true)},100);
  }

  function stop(done=false){
    if(!running&&!done)return;
    running=false;runToken++;clearAll();releaseWake();
    [el.difficulty,el.duration,el.footMode,el.cueMode].forEach(x=>x.disabled=false);
    el.start.textContent="▶ トレーニング開始";el.start.classList.remove("running");el.status.textContent=done?"おつかれさまでした":"停止中";
    if(done){toast("トレーニング終了");if(navigator.vibrate)navigator.vibrate([80,50,120])}
  }

  el.start.addEventListener("click",()=>running?stop(false):start());
  el.bpm.addEventListener("input",()=>{el.bpmValue.textContent=el.bpm.value;localStorage.setItem("toeRhythm_bpm",el.bpm.value)});
  ["difficulty","duration","footMode","soundMode","cueMode","screenMode"].forEach(id=>el[id].addEventListener("change",()=>{save(id);if(id==="footMode")updateLaneVisibility();if(id==="duration"&&!running){const d=Number(el.duration.value);el.time.textContent=fmt(d>0?d:Infinity)}}));
  el.helpBtn.addEventListener("click",()=>el.help.classList.add("open"));el.closeHelp.addEventListener("click",()=>el.help.classList.remove("open"));el.help.addEventListener("click",e=>{if(e.target===el.help)el.help.classList.remove("open")});
  document.addEventListener("visibilitychange",async()=>{if(document.hidden&&running){stop(false);toast("画面が切り替わったため停止しました")}else if(!document.hidden&&running)await requestWake()});
  window.addEventListener("pagehide",()=>stop(false),{once:false});
  window.addEventListener("beforeunload",()=>stop(false));

  const savedBpm=localStorage.getItem("toeRhythm_bpm");if(savedBpm){el.bpm.value=savedBpm;el.bpmValue.textContent=savedBpm}
  ["difficulty","duration","footMode","soundMode","cueMode","screenMode"].forEach(restore);
  updateLaneVisibility();
  const d=Number(el.duration.value);el.time.textContent=fmt(d>0?d:Infinity);
})();
</script>
</body>
</html>
